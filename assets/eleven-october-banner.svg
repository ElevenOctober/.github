<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">11 October, An Open Engineering Collective</title>
  <desc id="desc">A minimal ivory eclipse with one orbiting point beside the 11 October wordmark on a near-black field.</desc>
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#EAE5DC" stop-opacity=".09"/>
      <stop offset="1" stop-color="#EAE5DC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="280" fill="#050505"/>
  <circle cx="230" cy="140" r="114" fill="url(#glow)"/>
  <ellipse cx="230" cy="140" rx="110" ry="40" transform="rotate(-28 230 140)" fill="none" stroke="#B6A78D" stroke-opacity=".5" stroke-width="1"/>
  <circle cx="230" cy="140" r="64" fill="#EAE5DC"/>
  <circle cx="254" cy="123" r="60" fill="#050505"/>
  <circle cx="327.06" cy="88.38" r="4" fill="#EAE5DC">
    <animateMotion begin="0s" dur="32s" calcMode="paced" repeatCount="indefinite" path="M 0 0 A 110 40 -28 1 1 -194.12 103.24 A 110 40 -28 1 1 0 0"/>
  </circle>
  <text x="425" y="132" fill="#EAE5DC" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="500" letter-spacing="8">11 OCTOBER</text>
  <text x="428" y="179" fill="#C9C1B5" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="2">AN OPEN ENGINEERING COLLECTIVE</text>
</svg>
